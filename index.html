<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5B9BFF">
<title>POV by Unrest</title>
<meta name="description" content="Anonymous polls, tier lists, quizzes and red flag / green flag. POV by Unrest.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F4EF}
#pov{--p:#F6F4EF;--i:#15140F;--s:#FFD84D;--b:#5B9BFF;--m:#6B675E;background:var(--p);color:var(--i);font:16px/1.4 Inter,system-ui,sans-serif;min-height:100vh;padding:0 14px 70px;
 *{box-sizing:border-box}
 button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
 .w{max-width:880px;margin:0 auto}
 header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:16px 0 8px}
 .lg{display:flex;align-items:center;gap:8px;font-weight:700}
 .lg b{font:400 30px/1 'Patrick Hand',cursive;background:var(--s);padding:2px 10px 4px;transform:rotate(-2deg);border-radius:10px;text-transform:uppercase}
 .lg em{font-style:normal;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--m);font-weight:600}
 .tabs,.sg{display:flex;gap:6px;flex-wrap:wrap}
 .tabs button,.sg button{padding:9px 16px;border-radius:99px;background:#fff;font-weight:600;font-size:14px;transition:.2s}
 .tabs button.on,.sg button.on{background:var(--i);color:var(--p)}
 h1,h2,h3{font-family:'Patrick Hand',cursive;font-weight:400;text-transform:uppercase;margin:0;line-height:1}
 h1{font-size:clamp(38px,9vw,64px);margin:22px 0 6px}
 h3{font-size:27px;line-height:1.02;margin-bottom:14px}
 .nt{color:var(--m);margin:0 0 14px;font-size:14px}
 .g{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));margin-top:14px}
 .cd{border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:8px;text-align:left}
 .cd.c{cursor:pointer;transition:transform .25s}.cd.c:hover{transform:translateY(-3px)}
 .cd small{font-size:13px;opacity:.7}
 .op,.bt{display:block;width:100%;text-align:left;background:#fff;border-radius:16px;padding:13px 15px;font-weight:600;transition:transform .15s}
 .op:hover{transform:translateY(-2px)}.op:active,.bt:active{transform:scale(.98)}
 .bt.k{background:var(--i);color:var(--p);text-align:center;width:auto;display:inline-block;border-radius:99px;padding:11px 22px}
 .bt.w2{width:auto;display:inline-block;border-radius:99px;padding:9px 16px}
 .rs{position:relative;background:rgba(255,255,255,.6);border-radius:14px;overflow:hidden;padding:11px 14px;font-weight:600;display:flex;justify-content:space-between;gap:10px;font-size:15px}
 .rs i{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.95);z-index:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
 .rs.me i{background:var(--s)}.rs span{position:relative;z-index:1}
 .tr{display:flex;gap:4px;margin-bottom:4px}
 .tl{flex:none;width:54px;min-height:54px;display:grid;place-items:center;font:400 28px 'Patrick Hand',cursive;border-radius:12px}
 .tc{flex:1;display:flex;flex-wrap:wrap;gap:6px;background:#fff;border-radius:12px;padding:7px;min-height:54px;align-content:flex-start}
 .ch{background:var(--p);border:2px solid transparent;border-radius:99px;padding:7px 13px;font-size:14px;font-weight:600}
 .ch.on{border-color:var(--i);background:var(--s)}
 .rk{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:6px;flex-wrap:wrap;font-weight:600}
 .rk div{display:flex;gap:4px}
 .rk button{width:36px;height:36px;border-radius:10px;background:var(--p);font-weight:700}
 .in{width:100%;max-width:300px;padding:11px 15px;border-radius:99px;border:2px solid var(--i);background:#fff;font:inherit}
 .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px;align-items:center}
 .fl{border-radius:30px;padding:28px 22px;text-align:center;background:var(--b);margin-top:14px}
 .fl h3{font-size:clamp(28px,6vw,40px)}
 .fb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
 .fb button{padding:14px 24px;border-radius:99px;font-weight:700;font-size:16px}
 .red{background:#E5483C;color:#fff}.grn{background:#1F9D55;color:#fff}
 .back{color:var(--m);font-weight:600;padding:12px 0}
 .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--i);color:var(--p);padding:11px 20px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:9}
 .toast.on{opacity:1;transform:translate(-50%,0)}
 footer{margin-top:40px;color:var(--m);font-size:13px;text-align:center}
 .a{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
 @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
 @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
}
</style>
</head>
<body>
<div id="pov"><div class="w">
 <header><div class="lg"><b>POV</b><em>by Unrest</em></div><div class="tabs" id="tabs"></div></header>
 <main id="main"></main>
 <footer>Anonymous by design. Demo data, not real responses. POV by Unrest.</footer>
</div><div class="toast" id="toast" role="status"></div></div>
<script>
(function(){
var R=document.getElementById('pov'),M=R.querySelector('#main'),K='pov-by-unrest-v2';
var E=function(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var CL=['#C8F169','#FFA9C6','#5B9BFF','#86D9A8','#FFA062','#BBA9FF','#8FE3E8','#FFD84D'],TL=['S','A','B','C','D'],TC=['#E5483C','#FF9F43','#FFD84D','#6BCB77','#5B9BFF'];
/* ---------- data ---------- */
var P=[
{id:'a',q:'Would you date someone from your own college?',o:['Absolutely.','Depends on the person.','Probably not.','Never.'],n:[150,260,120,50],s:[160,226,121,48]},
{id:'b',q:'Would you rather be respected or liked?',o:['Respected.','Liked.','Both, no compromise.','Depends on the room.'],n:[280,120,160,90],s:[258,124,161,89]},
{id:'c',q:'Is texting first a big deal?',o:['Not at all.','Slightly.','Yes, a big deal.','Depends who it is.'],n:[230,170,60,140],s:[237,182,58,131]},
{id:'d',q:'Is a situationship just a nicer word for being undecided?',o:['Yes.','Sometimes.','No, its own thing.','Both must agree.'],n:[170,150,90,70],s:[159,147,86,63]},
{id:'e',q:'Do societies pick on talent or connections?',o:['Talent, mostly.','A bit of both.','Mostly connections.','All connections.'],n:[50,170,230,150],s:[68,172,206,131]},
{id:'f',q:'Would you bunk class for your crush?',o:['Every time.','Once in a while.','Only if boring.','Never.'],n:[80,210,110,140],s:[84,211,108,133]},
{id:'g',q:'Which campus has better food?',o:['North.','South.','Both overrated.','Off-campus.'],n:[210,100,90,60],s:[70,190,120,110]},
{id:'h',q:'Is South too far to count as real DU?',o:['Yes.','A bit.','No.','Say that to my face.'],n:[130,170,100,70],s:[80,160,180,60]}];
var TS=[
{id:'sn',t:'Canteen snacks',i:[['Samosa',4.6],['Chai',4.8],['Maggi',4.2],['Aloo paratha',4.0],['Bread pakora',3.1],['Cold coffee',3.3],['Momos',3.9],['Chhole bhature',3.6]]},
{id:'sp',t:'Campus hangout spots',i:[['Quad lawn',4.5],['Library reading room',2.4],['Canteen',4.1],['Sports ground',3.4],['Society hub steps',3.7],['Auditorium balcony',3.0],['Photocopy queue',1.6]]},
{id:'fe',t:'Fest moments',i:[['Dandiya Night',4.4],['Freshers',4.0],['Open mic',3.3],['Debate finals',2.6],['Trivia night',3.5],['Rooftop movie',4.3],['Farewell',4.1]]}];
var QZ=[
{id:'q1',t:'Which DU energy are you?',d:'5 questions',q:[
 ['Free period. You...','Find a quiet corner','Head to the canteen','Check which society is recruiting','Leave campus'],
 ['Ideal Friday','Notes and chai','Long lunch with everyone','Event planning meeting','Metro to somewhere random'],
 ['Attendance hits 68%','Impossible, I am at 95','Fine, I know the guard','I will get a certificate for it','Math says I can bunk 4 more'],
 ['Group project role','Does all the research','Brings snacks, keeps morale','Assigns everyone tasks','Joins the call late'],
 ['Fest outfit','Same as class','Whatever is clean','Matching with the team','Comfortable, always']],
 r:[['Library Ghost','Quiet, prepared, secretly everyone\'s notes source.'],['Canteen Mayor','You know every vendor. Half of campus knows you.'],['Society Hustler','Three roles, two events, one nap a week.'],['Bunk Specialist','Attendance is a suggestion. You still pass somehow.']]},
{id:'q2',t:'What is your texting style?',d:'4 questions',q:[
 ['Phone buzzes. You...','Reply in 10 seconds','Reply when I get time','Send a 2 minute voice note','Read it, forget it exists'],
 ['You get a dry "k"','Panic, ask what is wrong','Reply with a full thought later','Call them','Leave it on read'],
 ['Group chat: 214 unread','Read all of it','Skim the last 5','Listen to voice notes','Mute it'],
 ['Texting first is...','Easy','Fine, eventually','Only by voice note','A strategy']],
 r:[['Instant Replier','Fast, present, slightly scary.'],['Slow Burner','Worth the wait. Mostly.'],['Voice Note Villain','Nobody has time. You send it anyway.'],['Seen-Zone Legend','Mysterious or just busy. Nobody knows.']]}];
var FL=[['Replies after 3 days but posts stories in between',88],['Says "I am bad at texting" and never improves',71],['Remembers your coffee order',4],['Follows all your friends before you meet',54],['Calls you out kindly when you are wrong',8],['Still best friends with every ex',47],['No plans, always "let\'s see"',83],['Shows up on time to your event',6],['Screenshots your chat for their friends',76],['Splits the bill without making it weird',7]];
/* ---------- state ---------- */
var S={tab:'p',c:null,sl:'a',v:{},t:{},qd:{},f:{},tv:null,tm:'c',m:{it:[],p:{}}},Q=null,sel=null,ts=0;
try{var d=JSON.parse(localStorage.getItem(K));if(d)Object.assign(S,d);S.tab='p';S.tv=null}catch(e){}
function sv(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function toast(t){var e=R.querySelector('#toast');e.textContent=t;e.classList.add('on');clearTimeout(ts);ts=setTimeout(function(){e.classList.remove('on')},2200)}
function pcts(a){var T=a.reduce(function(x,y){return x+y},0)||1;return a.map(function(x){return Math.round(x/T*100)})}
/* ---------- views ---------- */
function polls(){
 var h='<h1 class=a>Cast your POV.</h1><p class=nt>Pick your campus once. Vote anonymously. See where you stand.</p><div class=sg>'+[['n','North'],['s','South']].map(function(c){return '<button data-a=camp data-x='+c[0]+(S.c===c[0]?' class=on':'')+'>I am '+c[1]+'</button>'}).join('')+'</div><div class=row><span class=nt style="margin:0">Results:</span><div class=sg>'+[['a','Everyone'],['n','North'],['s','South']].map(function(c){return '<button data-a=sl data-x='+c[0]+(S.sl===c[0]?' class=on':'')+'>'+c[1]+'</button>'}).join('')+'</div></div><div class=g>';
 P.forEach(function(p,k){var v=S.v[p.id];h+='<div class="cd a" style="background:'+CL[k%8]+';--i:'+k+'"><h3>'+E(p.q)+'</h3>';
  if(v==null)h+=p.o.map(function(o,j){return '<button class=op data-a=vote data-x='+p.id+' data-y='+j+'>'+E(o)+'</button>'}).join('');
  else{var a=p.o.map(function(_,j){return (S.sl!=='s'?p.n[j]:0)+(S.sl!=='n'?p.s[j]:0)+(v===j&&(S.sl==='a'||S.sl===S.c)?1:0)}),pc=pcts(a);
   h+=p.o.map(function(o,j){return '<div class="rs'+(v===j?' me':'')+'"><i style="width:'+pc[j]+'%"></i><span>'+E(o)+'</span><span>'+pc[j]+'%</span></div>'}).join('')+'<small>'+a.reduce(function(x,y){return x+y},0)+' sample responses</small>'}
  h+='</div>'});
 return h+'</div>';
}
function avg(L,k){var u=(S.t[L.id]||{})[k];return (L.i[k][1]*20+(u||0))/(u?21:20)}
function tier(a){return a>=4.5?0:a>=3.5?1:a>=2.5?2:a>=1.5?3:4}
function tiers(){
 if(S.tv==='mk')return maker();
 var L=TS.filter(function(z){return z.id===S.tv})[0];
 if(!L){var h='<h1 class=a>Tier lists.</h1><p class=nt>Rank things with the whole campus, or build your own.</p><div class=g>';
  TS.forEach(function(l,k){var n=S.t[l.id]?' &middot; ranked':'';h+='<button class="cd c a" style="background:'+CL[k%8]+'" data-a=tv data-x='+l.id+'><h3>'+E(l.t)+'</h3><small>'+l.i.length+' items'+n+'</small></button>'});
  return h+'<button class="cd c a" style="background:var(--i);color:var(--p)" data-a=tv data-x=mk><h3>Make your own</h3><small style="color:var(--p)">Tap to place. Copy and share.</small></button></div>'}
 var h='<button class=back data-a=tv data-x="">&larr; All lists</button><h1>'+E(L.t)+'</h1><div class="sg" style="margin:12px 0">'+[['c','Community'],['y','Your rank']].map(function(c){return '<button data-a=tm data-x='+c[0]+(S.tm===c[0]?' class=on':'')+'>'+c[1]+'</button>'}).join('')+'</div>';
 if(S.tm==='y')return h+'<p class=nt>Tap a tier for each item. Saves instantly.</p>'+L.i.map(function(it,k){var u=(S.t[L.id]||{})[k];return '<div class=rk><span>'+E(it[0])+'</span><div>'+TL.map(function(l,j){var r=5-j;return '<button data-a=rk data-x='+L.id+' data-y='+k+' data-z='+r+(u===r?' style="background:'+TC[j]+'"':'')+'>'+l+'</button>'}).join('')+'</div></div>'}).join('');
 var rows=[[],[],[],[],[]];L.i.forEach(function(it,k){var a=avg(L,k);rows[tier(a)].push([it[0],a])});
 return h+'<p class=nt>Sample community ranking. Your rank counts once you add it.</p>'+rows.map(function(r,j){r.sort(function(x,y){return y[1]-x[1]});return '<div class=tr><div class=tl style="background:'+TC[j]+'">'+TL[j]+'</div><div class=tc>'+r.map(function(x){return '<span class=ch title="avg '+x[1].toFixed(1)+'">'+E(x[0])+'</span>'}).join('')+'</div></div>'}).join('');
}
function maker(){
 var m=S.m,h='<button class=back data-a=tv data-x="">&larr; All lists</button><h1>Make your own</h1><div class=row><input class=in id=mi maxlength=30 placeholder="Add an item"><button class="bt k" data-a=mad>Add</button></div>';
 var chip=function(it){return '<span class="ch'+(sel===it.id?' on':'')+'" data-a=msel data-x='+it.id+'>'+E(it.n)+'</span>'};
 for(var j=0;j<5;j++){var r=5-j;h+='<div class=tr data-a=mput data-x='+r+'><div class=tl style="background:'+TC[j]+'">'+TL[j]+'</div><div class=tc>'+m.it.filter(function(i){return m.p[i.id]===r}).map(chip).join('')+'</div></div>'}
 h+='<p class=nt style="margin-top:16px">Unsorted: tap an item, then tap a tier.</p><div class=tc data-a=mput data-x=0>'+(m.it.filter(function(i){return !m.p[i.id]}).map(chip).join('')||'<span class=nt>Add items above.</span>')+'</div>';
 return h+'<div class=row style="margin-top:18px"><button class="bt k" data-a=mcp>Copy as text</button><button class="bt w2" data-a=mrst>Reset</button></div>';
}
function quiz(){
 if(Q){var z=QZ.filter(function(x){return x.id===Q.id})[0],q=z.q[Q.s];
  return '<button class=back data-a=qx>&larr; Quit</button><div class="cd a" style="background:'+CL[Q.s%8]+'"><small>'+(Q.s+1)+' / '+z.q.length+'</small><h3>'+E(q[0])+'</h3>'+q.slice(1).map(function(a,j){return '<button class=op data-a=qa data-y='+j+'>'+E(a)+'</button>'}).join('')+'</div>'}
 var h='<h1 class=a>Quizzes.</h1><p class=nt>Ten seconds each. Share your result.</p><div class=g>';
 QZ.forEach(function(z,k){var r=S.qd[z.id];h+='<div class="cd a" style="background:'+CL[(k+2)%8]+'"><h3>'+E(z.t)+'</h3>'+(r!=null?'<div class=rs><span>'+E(z.r[r][0])+'</span></div><small>'+E(z.r[r][1])+'</small><button class="bt w2" data-a=qs data-x='+z.id+'>Retake</button>':'<small>'+z.d+'</small><button class="bt k" data-a=qs data-x='+z.id+'>Start</button>')+'</div>'});
 return h+'</div>';
}
function flags(){
 var i=0;while(i<FL.length&&S.f[i])i++;
 var h='<h1 class=a>Red flag or green flag?</h1><p class=nt>Call it. See what everyone else said.</p>';
 if(i>=FL.length){var r=0;for(var k in S.f)if(S.f[k]==='r')r++;return h+'<div class=fl style="background:var(--s)"><h3>You called '+r+' red, '+(FL.length-r)+' green</h3><p class=nt>Done. Tough but fair.</p><button class="bt k" data-a=fr>Play again</button></div>'}
 var a=S.f[i-0]; /* i is first unanswered */
 return h+'<div class=fl><small>'+(i+1)+' / '+FL.length+'</small><h3>'+E(FL[i][0])+'</h3><div class=fb><button class=red data-a=fl data-x='+i+' data-y=r>Red flag</button><button class=grn data-a=fl data-x='+i+' data-y=g>Green flag</button></div></div>'+(i>0?lastRes(i-1):'');
}
function lastRes(i){var p=FL[i][1],u=S.f[i];return '<p class=nt style="text-align:center;margin-top:14px">Last one: you said <b>'+(u==='r'?'red':'green')+'</b>. '+(u==='r'?p:100-p)+'% agreed ('+p+'% red, '+(100-p)+'% green).</p>'}
function render(){
 R.querySelector('#tabs').innerHTML=[['p','Polls'],['t','Tier lists'],['q','Quizzes'],['f','Flags']].map(function(t){return '<button data-a=tab data-x='+t[0]+(S.tab===t[0]?' class=on':'')+'>'+t[1]+'</button>'}).join('');
 M.innerHTML=S.tab==='p'?polls():S.tab==='t'?tiers():S.tab==='q'?quiz():flags();
}
/* ---------- events ---------- */
function add(){var i=R.querySelector('#mi'),v=i&&i.value.trim();if(!v)return;S.m.it.push({id:'m'+Date.now().toString(36)+S.m.it.length,n:v});sv();render();var n=R.querySelector('#mi');if(n)n.focus()}
R.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='mi'){e.preventDefault();add()}});
R.addEventListener('click',function(e){
 var b=e.target.closest('[data-a]');if(!b)return;var x=b.dataset.x,y=b.dataset.y,z=b.dataset.z;
 switch(b.dataset.a){
 case'tab':S.tab=x;S.tv=null;Q=null;break;
 case'camp':S.c=x;break;
 case'sl':S.sl=x;break;
 case'vote':if(!S.c){toast('Pick your campus first');return}S.v[x]=+y;break;
 case'tv':S.tv=x||null;S.tm='c';break;
 case'tm':S.tm=x;break;
 case'rk':S.t[x]=S.t[x]||{};S.t[x][y]=+z;break;
 case'qs':Q={id:x,s:0,sc:[0,0,0,0]};break;
 case'qx':Q=null;break;
 case'qa':var zq=QZ.filter(function(k){return k.id===Q.id})[0];Q.sc[+y]++;Q.s++;if(Q.s>=zq.q.length){S.qd[Q.id]=Q.sc.indexOf(Math.max.apply(null,Q.sc));Q=null}break;
 case'fl':S.f[x]=y;break;
 case'fr':S.f={};break;
 case'mad':add();return;
 case'msel':sel=sel===x?null:x;break;
 case'mput':if(!sel)return;if(+x)S.m.p[sel]=+x;else delete S.m.p[sel];sel=null;break;
 case'mrst':S.m={it:[],p:{}};sel=null;break;
 case'mcp':var o=[];for(var j=0;j<5;j++){var r=5-j,n=S.m.it.filter(function(i){return S.m.p[i.id]===r}).map(function(i){return i.n});if(n.length)o.push(TL[j]+': '+n.join(', '))}
  var tx=o.join('\n')+'\n\nMade on POV by Unrest';if(navigator.clipboard)navigator.clipboard.writeText(tx).then(function(){toast('Copied')},function(){toast('Could not copy')});else toast('Could not copy');return;
 }
 sv();render();
});
render();
})();
</script>
</body>
</html>
